raciones."],["WA","WhatsApp Business","Consultas, catálogo, seguimiento y confirmación."]],"foot":"Empezá por Facebook + WhatsApp si son los canales que tu público ya usa.","kind":"cards","note":"","extra":""},{"title":"La primera impresión vende confianza","sub":"Retomamos el efecto halo del taller de Jalapa: una imagen cuidada puede influir en la percepción, no garantiza ventas.","items":[["✓","Perfil claro","Nombre reconocible, foto nítida y descripción: qué hacés + Estelí."],["✓","Información útil","Horario, ubicación exacta, contacto, menú o tarifas vigentes."],["✓","Prueba social","Opiniones reales, fotos propias y permiso de los clientes."]],"foot":"Una visita al perfil debería aclarar qué ofrecés, dónde estás y cómo contactarte.","kind":"cards","note":"","extra":""},{"title":"¿Cuál perfil inspira confianza?","sub":"Dos versiones del perfil de Estelí Tours.","items":[["A","Perfil A","Mirá cómo se presenta el negocio."],["B","Perfil B","Mirá cómo se presenta el negocio."]],"foot":"","kind":"cards","note":"","extra":""},{"title":"Nunca más:<br>«¿Qué publico hoy?»","sub":"Ideas, emociones y redacción","items":[],"foot":"ESTELÍ · LABORATORIO DIGITAL","kind":"section","note":"","extra":"02"},{"title":"No vendas cosas. Mostrá experiencias.","sub":"La emoción atrae; los datos concretos ayudan a decidir.","items":[["Antes","Habitación disponible","“Tenemos habitaciones.”"],["Después","Descanso de montaña","“Despertá con aire fresco y disfrutá un desayuno norteño. Consultá fechas y tarifas.”"]],"foot":"No inventés servicios ni beneficios. Mostrá la experiencia real.","kind":"compare","note":"","extra":""},{"title":"Activá los sentidos","sub":"Una buena imagen puede evocar sensaciones sin prometer resultados mágicos.","items":[["01","Vista","Neblina sobre el sendero, luz de mañana, plato servido."],["02","Sonido","Café al servir, hojas, agua o ambiente natural."],["03","Textura y sabor","Primer plano de rosquillas, tortilla recién hecha o café."]],"foot":"Una descripci ],"foot":"Acceso: business.facebook.com · Los nombres y funciones pueden variar según cuenta y dispositivo.","kind":"flow","note":"","extra":""},{"title":"Tres planos para contar una visita","sub":"Una demostración de encuadre con fotografías de Estelí.","items":[],"foot":"En una secuencia, el plano abierto ubica, el plano medio da contexto y el detalle acerca la experiencia.","kind":"shotDemo","note":"Mostrá los tres encuadres de ejemplo y explicá qué comunica cada uno.","extra":""},{"title":"De un mensaje<br>a una reserva.","sub":"WhatsApp Business y atención","items":[],"foot":"ESTELÍ · LABORATORIO DIGITAL","kind":"section","note":"","extra":"04"},{"title":"WhatsApp Business es tu recepción","sub":"Prepará tu canal antes de invertir en publicidad.","items":[["01","Perfil","Nombre, horario, descripción y ubicación."],["02","Catálogo","Fotos propias, precios vigentes y condiciones."],["03","Respuestas rápidas","Tarifas, ubicación, disponibilidad y qué incluye."],["04","Etiquetas","Nuevo, cotizado, pendiente y confirmado."]],"foot":"No envíes mensajes promocionales sin consentimiento.","kind":"cards","note":"","extra":""},{"title":"Simulador: respondé al visitante","sub":"Un buen mensaje responde y ayuda a decidir.","items":[],"foot":"","kind":"chat","note":"Mostrá las posibles respuestas y explicá cómo confirmar disponibilidad sin prometer algo que no se ha verificado.","extra":""},{"title":"Cerrá sin presionar","sub":"Un proceso simple y verificable.","items":[["01","Preguntá","Fecha, número de personas y necesidades."],["02","Confirmá","Disponibilidad real, precio total y condiciones."],["03","Registrá","Nombre, fecha, estado y pago confirmado por canal seguro."],["04","Acompañá","Indicaciones de llegada y solicitud de opinión después de la visita."]],"foot":"No publiques capturas de chats con datos personales sin autorización.","kind":"cards","note":"","extra":""},{"title":"Meta Ads:<br>invertir con sentido.","sub":"Facebook e Instagram","items":[],"foot":"ESTELÍ · LABORATORIO DIGITAL","kind":"section","note":"","extra":"05"},{"title":"Orgánico vs. pagado","sub":"La publicidad amplifica una propuesta, no arregla un servicio deficiente.","items":[["Orgánico","Publicar sin pauta","Construye presencia, responde dudas y prueba ideas."],["Pagado","Invertir para llegar a un público","Configura objetivo, presupuesto, audiencia y anuncio."]],"foot":"No existe presupuesto mínimo universal que garantice resultados; revisá lo permitido por tu cuenta.","kind":"compare","note":"","extra":""},{"title":"Tres herramientas, tres funciones","sub":"Conectá tu página, cuenta de Instagram y WhatsApp cuando corresponda.","items":[["01","Promocionar","Configuración rápida desde una publicación."],["02","Business Suite","Contenido, bandeja de entrada, estadísticas y gestión básica."],["03","Ads Manager","Control detallado de campañas, objetivos, públicos, creatividades y medición."]],"foot":"Revisá permisos, método de pago y autenticación de dos factores.","kind":"cards","note":"","extra":""},{"title":"¿Qué querés conseguir?","sub":"El objetivo publicitario debe coincidir con tu meta comercial.","items":[["01","Reconocimiento","Que más personas conozcan el negocio."],["02","Tráfico","Llevar personas a un destino o enlace."],["03","Interacción","Mensajes, interacciones o reproducciones según configuración."],["04","Clientes potenciales","Capturar consultas mediante formularios o chat."],["05","Ventas","Optimizar conversiones cuando exista medición adecuada."],["06","Promoción de app","Para negocios que cuentan con una aplicación."]],"foot":"Para consultas por WhatsApp, revisá Interacción o Clientes potenciales y las opciones de mensajería habilitadas.","kind":"cards","note":"","extra":""},{"title":"La estructura de una campaña","sub":"Tres niveles del Administrador de Anuncios.","items":[["1","Campaña","Objetivo: conversaciones."],["2","Conjunto de anuncios","Público, presupuesto (según configuración), fechas, ubicaciones."],["3","Anuncio","Video/ onsultadas el 24 de noviembre de 2026. Tendencias 2027: proyecciones, no resultados futuros confirmados.","items":[],"foot":"","kind":"sources","note":"","extra":""},{"title":"Estelí tiene mucho<br><em>que mostrar.</em>","sub":"No necesitás publicar perfecto. Necesitás publicar con intención, verdad y constancia.","items":[],"foot":"MSc. Silvio Rodríguez Tiffer · INTUR · Estelí","kind":"cover","note":"Cerrá recapitulando los ejemplos de negocio mostrados durante la capacitación.","extra":""}];slides.splice(2,0,{"title":"Preguntas en vivo","sub":"Escaneá el código QR y enviá tu consulta durante el taller.","items":[],"foot":"No necesitás instalar una aplicación ni crear una cuenta.","kind":"questionQr","note":"Invitá al grupo a escanear el QR. Las preguntas llegarán a tu campanita privada.","extra":""});let idx=0, business='Hospedaje';const $=s=>document.getElementById(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const state={};const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('esteli2027_'+k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem('esteli2027_'+k,JSON.stringify(v))}catch{}};business=get('biz','Hospedaje');const examples={Hospedaje:['Descansá en Estelí','Habitación cómoda y ambiente tranquilo','Consultá fecha y tarifa por WhatsApp'],Restaurante:['Almorzá con sabor norteño','Comida recién preparada y ambiente familiar','Pedí el menú y reservá tu mesa'],Cafetería:['¿Un café en Estelí?','Café preparado al momento','Consultá horarios y ubicación'], 'Finca / tour':['Una escapada a la naturaleza','Caminata guiada y paisaje norteño','Consultá disponibilidad y qué incluye'],Artesanía:['Llevate un recuerdo de Estelí','Piezas hechas a mano','Preguntá por modelos y precios']};
function tiles(items,kind){let cls=items.length===2?'two':items.length===4?'four':items.length===5?'five':items.length===6?'six':'';return `<div class="cards ${cls} ${kind}">${items.map(([n,t,d])=>`<div class="tile">${kind==='formats'?`<div class="format-shape" style="aspect-ratio:${n.replace(':','/')}"></div>`:''}<span class="num">${esc(n)}</span><h2>${esc(t)}</h2><p>${esc(d)}</p></div>`).join('')}</div>`}
function content(s){switch(s.kind){case 'cover':case 'section':return '';case 'stat':return `<div class="stat">${s.extra}</div><div class="statlabel">millones · Nicaragua</div>`;case 'selectbiz':return `<div class="choices" style="grid-template-columns:repeat(2,1fr)">${Object.keys(examples).map(x=>`<button data-biz="${esc(x)}" class="${x===business?'chosen':''}">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback">Elegido: ${esc(business)}. Meta del día: más consultas útiles.</div>`;case 'roulette':return `<div class="center"><div class="num">BANCO DE IDEAS</div><div id="idea" class="idea">¿Qué podemos contar?</div><div id="ideaDesc" class="ideaDesc">Girá para recibir una idea adaptada a tu negocio.</div><button id="spin">↻ Girar ruleta</button></div>`;case 'composer':{let v=get('copy',examples[business]);return `<div class="flex"><div class="panel"><label>1. Gancho<input id="hook" value="${esc(v[0])}" maxlength="110"></label><label>2. Beneficio<textarea id="benefit" maxlength="220">${esc(v[1])}</textarea></label><label>3. Llamada a la acción<input id="action" value="${esc(v[2])}" maxlength="120"></label><button id="copyPost">Copiar texto</button></div><div class="phone"><b>● &nbsp; Mi negocio · Estelí</b><div class="fakeimg">TU FOTO REAL</div><p id="post"></p><div class="cta">Consultar por WhatsApp</div></div></div>`}case 'prompt':return `<div class="panel"><h3>Prompt reutilizable</h3><p id="promptText">Actuá como especialista en contenido turístico. Escribí tres publicaciones para un negocio de ${esc(business.toLowerCase())} en Estelí, Nicaragua. Usá tono natural, beneficio concreto y llamada a la acción por WhatsApp. No inventés precios ni servicios. Preguntame los datos faltantes. Proponé un guion vertical de 15 segundos.</p><button id="copyPrompt">Copiar prompt</button> <a href="https://chatgpt.com/" target="_blank" rel="noopener">Abrir ChatGPT ↗</a></div>`;case 'hookBank':case 'shotDemo':case 'publicationDemo':return '';case 'photo':return `<div class="flex"><div class="photoBox"><img id="ownPhoto" alt="Fotografía seleccionada" hidden><div id="gridlines" class="thirds"></div></div><div class="panel"><h3>Probá con tu foto</h3><p>La cuadrícula ayuda a distribuir el peso visual. Centrar también puede funcionar cuando hay simetría.</p><label>Cargar foto<input id="upload" type="file" accept="image/*"></label><button id="gridToggle">Mostrar / ocultar cuadrícula</button></div></div>`;case 'calendar':return `<div class="calendar">${[['Lun','Inspirar','Foto de una experiencia'],['Mar','Conversar','Responder consultas'],['Mié','Educar','Consejo útil'],['Jue','Crear','Grabar clips'],['Vie','Vender','Plan de fin de semana'],['Sáb','Mostrar','Historia en tiempo real'],['Dom','Medir','Revisar consultas']].map(([d,t,p])=>`<div class="tile"><span class="num">${d}</span><h2>${t}</h2><p>${p}</p></div>`).join('')}</div><div class="foot">Empezá con 3 publicaciones semanales; sostené una frecuencia realista.</div>`;case 'chat':return `<div class="bubble">Hola, ¿tienen disponibilidad para el sábado? Somos cuatro personas. ¿Cuánto cuesta?</div><div class="choices"><button data-chat="0">Sí, escribinos después.</button><button data-chat="1">¡Hola! ¿Para qué hora o fecha exacta? Confirmamos disponibilidad y te enviamos el precio total y qué incluye.</button><button data-chat="2">Reservá ya, solo quedan cupos (sin verificar).</button></div><div id="feedback" class="feedback"></div>`;case 'ads':return `<div class="flex"><div class="panel"><label>Objetivo<select id="adGoal"><option>Conversaciones por WhatsApp</option><option>Reconocimiento</option><option>Tráfico al sitio web</option></select></label><label>Público de prueba<select id="adArea"><option>Estelí y alrededores</option><option>Managua y León</option><option>Visitantes de varias ciudades</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>C$/día<input id="adDaily" type="number" min="0" value="100"></label><label>Días<input id="adDays" type="number" min="1" max="30" value="7"></label></div><label>Creatividad<select id="adCreative"><option>Reel propio</option><option>Foto con oferta clara</option><option>Carrusel de experiencias</option></select></label></div><div class="panel"><h3>Resumen de campaña</h3><div class="metric"><span>Presupuesto planificado</span><strong id="adTotal"></strong></div><p id="adSummary"></p><p class="small">Simulación educativa. No es cotización ni previsión de alcance. No se realiza ningún pago.</p></div></div>`;case 'calc':return `<div class="flex"><div class="panel"><label>Inversión publicitaria C$<input id="spend" type="number" min="0" value="500"></label><label>Consultas útiles<input id="leads" type="number" min="0" value="20"></label><label>Reservas atribuibles<input id="sales" type="number" min="0" value="5"></label><label>Ingresos atribuibles C$<input id="revenue" type="number" min="0" value="2500"></label><label>Costos variables C$<input id="cost" type="number" min="0" value="1400"></label></div><div class="panel"><div class="resultgrid"><div class="metric"><span>Costo por consulta</span><strong id="cpl"></strong></div><div class="metric"><span>Costo por reserva</span><strong id="cpa"></strong></div><div class="metric"><span>ROAS</span><strong id="roas"></strong></div><div class="metric"><span>Contribución tras pauta</span><strong id="profit"></strong></div></div><p>No es utilidad neta: aún faltan costos fijos y otros gastos.</p></div></div>`;case 'checklist':{let checks=['Foto o video propio, nítido y con permiso','Oferta verdadera, fechas y condiciones claras','Texto breve, con ubicación y beneficio','Llamada a la acción y contacto correcto','Revisión de formato, ortografía y audio autorizado','Plan de seguimiento de consultas y reservas'];let selected=get('checks',[]);return `<div class="choices">${checks.map((c,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${selected.includes(i)?'checked':''}>${esc(c)}</label>`).join('')}</div><div class="feedback" id="checkProgress"></div>`}case 'sources':return `<div class="sourceList">${[['DataReportal · Digital 2027: Nicaragua','https://datareportal.com/reports/digital-2027-nicaragua'],['Coursera · Tendencias de redes 2027','https://www.coursera.org/articles/social-media-trends'],['Hootsuite · Social Trends 2026','https://www.hootsuite.com/research/social-trends'],['Meta · Contenido original (marzo 2026)','https://about.fb.com/news/2026/03/rewarding-original-creators-on-facebook/'],['Meta · IA y rendimiento (enero 2026)','https://about.fb.com/news/2026/01/2026-ai-drives-performance/'],['Meta · Anuncios de interacción','https://es-la.facebook.com/business/ads/ad-objectives/engagement'],['Meta Blueprint · Formación gratuita','https://www.facebookblueprint.com/student/catalog?locale=es'],['Mapa Nacional de Turismo · Estelí','https://www.mapanicaragua.com/municipio-esteli/']].map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('')}</div><p class="small">Material base: Publicación exitosa en redes sociales 5.0 – Jalapa, proporcionado por el facilitador. Ejemplos comerciales ficticios.</p>`;case 'questionQr':return `<div class="questionQrSlide"><div><div class="num">PREGUNTAS DEL TALLER</div><p>Tu consulta llega al panel privado del expositor.</p><ol><li>Escaneá el QR.</li><li>Escribí tu nombre y pregunta.</li><li>El expositor la recibe en vivo.</li></ol><p class="questionQrHint">No ocupás instalar una aplicación.</p></div><div class="questionQrCard"><div id="questionQr" role="img" aria-label="Código QR para enviar preguntas"></div><a id="questionUrl" target="_blank" rel="noopener noreferrer"></a></div></div>`;default:return tiles(s.items,s.kind)}}
function renderQuestionQr(){const target=$("questionQr"),link=$("questionUrl");if(!target||!link)return;const base=window.INTUR_QA_CONFIG?.publicSiteBase || location.href;const url=new URL("preguntas.html",base).toString();link.href=url;link.textContent="Abrir formulario de preguntas";try{const lib=window.QRCodeLib;if(!lib)throw new Error("No está disponible el generador QR.");const qr=new lib.QRCode(0,lib.Level.M);qr.addData(url);qr.make();const n=qr.getModuleCount(),cell=Math.floor(360/(n+8)),size=(n+8)*cell,canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;canvas.setAttribute("aria-label","Código QR de participación");const context=canvas.getContext("2d");context.fillStyle="#fff";context.fillRect(0,0,size,size);context.fillStyle="#0b3551";for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))context.fillRect((x+4)*cell,(y+4)*cell,cell,cell);target.replaceChildren(canvas)}catch(error){target.textContent="Abrí el enlace que aparece debajo del código.";console.error(error)}}
function show(n, example=null){const previous=idx;const wasExample=EsteliInteractivos.isOpen();idx=Math.max(0,Math.min(slides.length-1,n));let s=slides[idx];let dark=['cover','section'].includes(s.kind);$('slide').className='slide'+(dark?' dark':'');$('slide').innerHTML=`<div class="kicker">${dark?'ESTELÍ · TALLER DE MARKETING TURÍSTICO':`ESTELÍ / LABORATORIO DIGITAL · ${String(idx+1).padStart(2,'0')}`}</div>${s.kind==='section'?`<div class="sectionnum">${s.extra}</div>`:''}<h1>${s.title}</h1><p class="subtitle">${esc(s.sub)}</p><div class="content">${content(s)}</div>${s.foot?`<div class="foot">${esc(s.foot)}</div>`:''}`;$('count').textContent=`${idx+1} / ${slides.length}`;$('bar').style.width=`${(idx+1)/slides.length*100}%`;$('prev').disabled=idx===0;$('next').disabled=idx===slides.length-1;$('notes').innerHTML='<strong>Notas del facilitador</strong><p>'+esc(s.note||'Presentá el concepto con un ejemplo del grupo y preguntá cómo se aplica a su negocio.')+'</p>';$('slide').scrollTop=0;EsteliLayout.decorate($('slide'),s,idx);
EsteliStage.dress($('slide'),s,idx);
const contentArea = $('slide').querySelector('.content');
if (s.kind === 'hookBank') EsteliGanchos.render(contentArea);
if (s.kind === 'shotDemo') EsteliDemostraciones.shots(contentArea);
if (s.kind === 'publicationDemo') EsteliDemostraciones.publication(contentArea);
if (typeof EsteliDiagrams !== 'undefined') EsteliDiagrams.enhance($('slide'),s,idx);
EsteliSimulators.enhance($('slide'),s,idx);

EsteliInteractivos.decorate($('slide'),idx+1);
const hash = example ? EsteliInteractivos.route(example) : '#' + (idx+1);
if (location.hash !== hash) history.replaceState(null,'',hash);
EsteliInteractivos.present(example,$('slide'));
if (previous !== idx || example || wasExample) window.scrollTo(0,0);
if(s.kind==='questionQr')renderQuestionQr();wire(s);}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}async function copy(t){try{await navigator.clipboard.writeText(t);toast('Texto copiado')}catch{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{if(document.execCommand('copy'))toast('Texto copiado');else toast('Seleccioná y copiá el texto manualmente')}catch{toast('Copiá el texto manualmente')}a.remove()}}
function wire(s){document.querySelectorAll('[data-biz]').forEach(b=>b.onclick=()=>{business=b.dataset.biz;save('biz',business);save('copy',examples[business]);show(idx)});if($('spin')){$('spin').onclick=()=>{const pool=[['EDUCAR','Explicá cómo llegar a tu '+business.toLowerCase()+' y qué debe llevar un visitante.'],['INSPIRAR','Contá la historia de una persona que trabaja en tu negocio.'],['ENTRETENER','Mostrá un pequeño detalle curioso de tu día a día.'],['VENDER','Explicá qué incluye una oferta real, con precio y contacto.'],['CONFIANZA','Mostrá una opinión real con autorización y respondé una pregunta frecuente.']];let x=pool[Math.floor(Math.random()*pool.length)];$('idea').textContent=x[0];$('ideaDesc').textContent=x[1]}}if($('hook')){const update=()=>{let a=['hook','benefit','action'].map(x=>$(x).value);$('post').textContent=a.join('\n\n');save('copy',a)};['hook','benefit','action'].forEach(x=>$(x).oninput=update);update();$('copyPost').onclick=()=>copy($('post').textContent)}if($('copyPrompt'))$('copyPrompt').onclick=()=>copy($('promptText').textContent);if($('upload')){$('upload').onchange=()=>{let f=$('upload').files[0];if(!f||!f.type.startsWith('image/'))return;let r=new FileReader();r.onload=()=>{$('ownPhoto').src=r.result;$('ownPhoto').hidden=false};r.readAsDataURL(f)};$('gridToggle').onclick=()=>$('gridlines').classList.toggle('off')}document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{$('feedback').textContent=+b.dataset.chat===1?'¡Bien! Confirmá datos y ofrecé una respuesta concreta.':'Esa respuesta puede generar dudas o promesas falsas. Probá la opción que verifica la disponibilidad.'});const val=x=>Math.max(0,Number($(x).value)||0);const money=x=>'C$ '+x.toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});if($('adGoal')){const update=()=>{$('adTotal').textContent=money(val('adDaily')*val('adDays'));$('adSummary').textContent=$('adGoal').value+' · '+$('adArea').value+' · '+$('adCreative').value+' · '+val('adDays')+' días.'};['adGoal','adArea','adDaily','adDays','adCreative'].forEach(x=>$(x).oninput=update);update()}if($('spend')){const update=()=>{let a=val('spend'),l=val('leads'),b=val('sales'),r=val('revenue'),c=val('cost');$('cpl').textContent=l?money(a/l):'—';$('cpa').textContent=b?money(a/b):'—';$('roas').textContent=a?(r/a).toFixed(2)+'×':'—';$('profit').textContent=money(r-c-a)};['spend','leads','sales','revenue','cost'].forEach(x=>$(x).oninput=update);update()}if($('checkProgress')){const update=()=>{let c=[...document.querySelectorAll('[data-check]:checked')].map(x=>+x.dataset.check);save('checks',c);$('checkProgress').textContent=c.length+' de 6 revisados'+(c.length===6?' · ¡Listo para publicar!':'')};document.querySelectorAll('[data-check]').forEach(x=>x.onchange=update);update()}}
const questionSlideIndex=slides.findIndex(slide=>slide.kind==='questionQr');$('qrShortcut').onclick=()=>show(questionSlideIndex);$('prev').onclick=()=>show(idx-1);$('next').onclick=()=>show(idx+1);$('menu').onclick=()=>{$('index').innerHTML=slides.map((s,i)=>`<button data-index="${i}" class="${i===idx?'active':''}">${i+1}. ${s.title.replace(/<[^>]*>/g,' ')}</button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{$('dialog').close();show(+b.dataset.index)});$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();$('noteBtn').onclick=()=>$('notes').classList.toggle('open');$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Usá F11 para pantalla completa en tu navegador')}};document.addEventListener('keydown',e=>{const focused = document.activeElement;
if($('dialog').open || $('qaOverlay')?.getAttribute('aria-hidden') === 'false')return;
if (EsteliInteractivos.isOpen()) {
  if (e.key === 'Escape') {e.preventDefault();EsteliInteractivos.close();}
  return;
}
if (focused?.matches('input,textarea,select,[contenteditable=true]'))return;
if(e.key===' ' && focused?.closest('button,a'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1)});
function showRoute() {
  const example = EsteliInteractivos.fromHash(location.hash);
  const slideNumber = example ? example.number : /^#\d+$/.test(location.hash) ? Number(location.hash.slice(1)) : 1;
  show(slideNumber-1,example);
}
window.addEventListener('hashchange',showRoute);
showRoute();

(() => {
  const stage = document.getElementById("slide");
  let start = null;
  stage.addEventListener("touchstart", event => {
    start = null;
    if (event.touches.length !== 1 || event.target.closest("a,button,input,textarea,select")) return;
    start = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  }, { passive: true });
  stage.addEventListener("touchend", event => {
    if (!start || !event.changedTouches.length) return;
    const dx = event.changedTouches[0].clientX - start.x;
    const dy = event.changedTouches[0].clientY - start.y;
    start = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.25) return;
    const button = document.getElementById(dx < 0 ? "next" : "prev");
    if (button && !button.disabled) button.click();
  }, { passive: true });
  stage.addEventListener("touchcancel", () => { start = null; }, { passive: true });
})();
</script><script type="module" src="assets/presenter-qa.js"></script></body></html>
